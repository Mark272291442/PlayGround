<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1b">
  <meta name="description" content="ECHO — a quiet space to talk with Ana, your voice companion.">
  <title>ECHO — Ana, voice companion</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh; overflow: hidden; color: #f4f6ff;
      background: radial-gradient(ellipse 52% 42% at 50% 28%, rgba(52, 83, 145, .29), transparent 76%),
                  radial-gradient(ellipse 38% 30% at 50% 88%, rgba(36, 57, 101, .15), transparent 80%), #080d1b;
    }
    main { min-height: 100svh; width: 100%; display: grid; place-items: center; padding: 34px 22px; }
    .experience { position: relative; width: min(100%, 520px); min-height: min(900px, calc(100svh - 68px)); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand { margin: 3px 0 42px; color: #9aa8c3; font-size: 12px; font-weight: 650; letter-spacing: .42em; padding-left: .42em; }
    .intro { z-index: 1; }
    h1 { margin: 0; font-size: clamp(35px, 8vw, 43px); font-weight: 520; letter-spacing: -.055em; line-height: 1.1; }
    .status { margin: 13px 0 0; color: #aab7cf; font-size: 14px; letter-spacing: .005em; }
    .orb-stage { position: relative; display: grid; place-items: center; flex: 1; width: 100%; min-height: 290px; margin: 3px 0 0; }
    .orb-halo { position: absolute; width: min(80vw, 390px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(89, 128, 222, .18), rgba(39, 67, 133, .08) 44%, transparent 70%); filter: blur(13px); }
    .orb {
      position: relative; width: clamp(205px, 57vw, 270px); aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(ellipse at 34% 26%, rgba(180, 218, 255, .92) 0%, rgba(111, 160, 247, .75) 13%, rgba(67, 95, 205, .88) 33%, rgba(44, 44, 132, .94) 56%, #171a48 75%, #10142e 100%);
      box-shadow: inset -26px -31px 52px rgba(2, 5, 24, .62), inset 13px 12px 34px rgba(195, 220, 255, .24), 0 0 45px rgba(86, 124, 234, .28), 0 0 110px rgba(68, 96, 201, .16);
      animation: drift 6s ease-in-out infinite;
    }
    .orb::before, .orb::after { content: ""; position: absolute; inset: 9%; border-radius: 50%; pointer-events: none; }
    .orb::before { background: radial-gradient(ellipse at 34% 29%, rgba(236, 248, 255, .5), transparent 25%), radial-gradient(ellipse at 67% 72%, rgba(100, 86, 219, .44), transparent 42%); filter: blur(9px); }
    .orb::after { inset: -10%; border: 1px solid rgba(148, 180, 255, .12); box-shadow: 0 0 28px rgba(105, 145, 255, .09); }
    .orb.listening { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.015); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); filter: saturate(1); } 50% { transform: scale(1.035); filter: saturate(1.2) brightness(1.08); } }
    .footer { width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 5px; }
    .hint { margin: 0 0 24px; color: #7786a3; font-size: 13px; }
    button { min-width: 210px; height: 60px; padding: 0 35px; border: 0; border-radius: 999px; background: #d74e68; color: white; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .13em; cursor: pointer; box-shadow: 0 10px 32px rgba(215, 78, 104, .2); transition: transform .18s ease, background .18s ease, box-shadow .18s ease; }
    button:hover { transform: translateY(-2px); background: #e85d76; box-shadow: 0 13px 36px rgba(215, 78, 104, .29); }
    button:focus-visible { outline: 3px solid #f4f6ff; outline-offset: 4px; }
    button.ended { background: #43557e; box-shadow: 0 10px 32px rgba(67, 85, 126, .2); }
    .caption { margin-top: 21px; color: #52617d; font-size: 11px; letter-spacing: .06em; }
    @media (max-height: 680px) { main { padding-block: 20px; } .experience { min-height: calc(100svh - 40px); } .brand { margin-bottom: 24px; } .orb-stage { min-height: 230px; } .orb { width: min(48vh, 220px); } .hint { margin-bottom: 15px; } .caption { margin-top: 13px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="echo-app" aria-label="ECHO voice companion preview">
    <section class="experience">
      <div class="brand">E C H O</div>
      <header class="intro">
        <h1>Ana</h1>
        <p class="status" id="status" aria-live="polite">A little space, just for you</p>
      </header>
      <div class="orb-stage" aria-hidden="true"><div class="orb-halo"></div><div class="orb" id="orb"></div></div>
      <footer class="footer">
        <p class="hint" id="hint">Your call is private to you</p>
        <button id="call-button" type="button">START</button>
        <div class="caption">A VOICE COMPANION · FILIPINO &amp; ENGLISH</div>
      </footer>
    </section>
  </main>
  <script>
    const button = document.querySelector('#call-button');
    const status = document.querySelector('#status');
    const hint = document.querySelector('#hint');
    const orb = document.querySelector('#orb');
    let active = false;
    button.addEventListener('click', () => {
      active = !active;
      button.textContent = active ? 'END CALL' : 'START';
      button.classList.toggle('ended', !active);
      status.textContent = active ? 'I’m here. Tell me what’s on your mind.' : 'Call ended';
      hint.textContent = active ? 'Listening with you' : 'Tap to call Ana again';
      orb.classList.toggle('listening', active);
    });
  </script>
</body>
</html>
